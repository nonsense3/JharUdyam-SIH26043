name: jharudyam_citizen
description: "JharUdyam Citizen App — Smart civic reporting for Jharkhand (SIH26043)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend & Database
  supabase_flutter: ^2.8.0

  # AI Vision
  google_generative_ai: ^0.4.6

  # Location & Maps
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Media
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

  # State Management
  provider: ^6.1.2

  # Storage & Utils
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

  # Notifications
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "officiallogo.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "officiallogo.jpeg"

flutter:
  uses-material-design: true
